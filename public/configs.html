<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oblivion — Configs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    .configs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .config-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .config-card:hover {
      border-color: var(--glass-border-glow);
      transform: translateY(-2px);
    }
    .config-header {
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .config-title { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .config-author { font-size: 0.85rem; color: var(--text-2); margin-top: 0.25rem; }
    .config-actions { display: flex; gap: 0.5rem; margin-top: auto; }
    .btn-apply {
      flex: 1;
      background: rgba(124,58,237,0.1);
      border: 1px solid rgba(124,58,237,0.4);
      color: var(--violet-light);
    }
    .btn-apply:hover { background: rgba(124,58,237,0.3); border-color: var(--violet); }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;">
          <img src="/images/logo.png" alt="Logo" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 10px rgba(124,58,237,0.6));"/>
        </div>
        <span class="sidebar-logo-text">OBLIVION</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
          Dashboard
        </a>
        <a href="/configs" class="nav-item active">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          Configs
        </a>
        <a href="/settings" class="nav-item">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Settings
        </a>
        <a href="/theme" class="nav-item">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.098 19.902a3.75 3.75 0 005.304 0l6.401-6.402M6.75 21A3.75 3.75 0 013 17.25V4.125C3 3.504 3.504 3 4.125 3h5.25c.621 0 1.125.504 1.125 1.125v4.072M6.75 21a3.75 3.75 0 003.75-3.75V8.197M6.75 21h13.125c.621 0 1.125-.504 1.125-1.125v-5.25c0-.621-.504-1.125-1.125-1.125h-4.072M10.5 8.197l2.88-2.88c.438-.439 1.15-.439 1.59 0l3.712 3.713c.44.44.44 1.152 0 1.59l-2.879 2.88M6.75 17.25h.008v.008H6.75v-.008z"/></svg>
          Theme
        </a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="logout()" class="nav-item w-full" style="color:var(--danger);">
          <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
      <div class="topbar">
        <button class="mobile-toggle" onclick="toggleSidebar()">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div style="position:absolute;left:50%;transform:translateX(-50%);font-size:1rem;font-weight:800;letter-spacing:0.12em;pointer-events:none;">OBLIVION</div>
        <button class="btn btn-primary btn-sm" onclick="openSaveModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          <span class="desktop-only">Save Config</span>
        </button>
      </div>
      
      <div class="page-content page-enter">
        <p style="color:var(--text-2);margin-bottom:1rem;">Apply community-made settings instantly or share your own with other Oblivion users.</p>
        
        <div class="configs-grid" id="configsGrid">
          <!-- Configs will be loaded here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Save Config Modal -->
  <div class="modal-overlay" id="saveModal">
    <div class="modal">
      <div class="modal-header">
        <h3 style="font-size:1.1rem;font-weight:700;">Save Configuration</h3>
      </div>
      <div class="modal-form">
        <div>
          <label style="display:block;font-size:0.85rem;color:var(--text-2);margin-bottom:0.5rem;">Config Name</label>
          <input type="text" class="input" id="confName" placeholder="e.g. Legit CFG V2" />
        </div>
        <label class="toggle" style="gap:1rem;justify-content:flex-start;">
          <input type="checkbox" id="confPublic" checked>
          <span class="toggle-slider"></span>
          <span style="font-size:0.9rem;">Make Public</span>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeSaveModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveConfig()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/auth.js"></script>
  <script>
    requireAuth();

    let myId = null;

    async function initConfigs() {
      // Get own user id for deletion logic
      const meRes = await apiFetch('/api/me');
      if (meRes.ok) {
        const { user } = await meRes.json();
        myId = user._id;
      }
      loadConfigs();
    }

    async function loadConfigs() {
      const grid = document.getElementById('configsGrid');
      grid.innerHTML = '<div style="color:var(--text-2);">Loading configs...</div>';

      const res = await apiFetch('/api/configs');
      if (!res.ok) { grid.innerHTML = '<div style="color:var(--danger);">Failed to load configs.</div>'; return; }
      const configs = await res.json();
      
      grid.innerHTML = '';
      if (configs.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-2);">No configs found. Be the first to share one!</div>';
        return;
      }

      configs.forEach(c => {
        const d = new Date(c.created_at).toLocaleDateString();
        const isMine = c.user_id === myId;
        const card = document.createElement('div');
        card.className = 'config-card';
        card.innerHTML = `
          <div class="config-header">
            <div>
              <div class="config-title">${c.name}</div>
              <div class="config-author">by <span style="color:var(--violet-light);font-weight:600;">${c.username}</span> • ${d}</div>
            </div>
            ${c.is_public ? '<span class="badge badge-success">Public</span>' : '<span class="badge badge-warning">Private</span>'}
          </div>
          <div class="config-actions">
            <button class="btn btn-sm btn-apply" onclick="applyConfig('${encodeURIComponent(c.data)}')">Apply Settings</button>
            ${isMine ? `<button class="btn btn-sm" style="background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2);" onclick="deleteConfig('${c._id}')">Delete</button>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function applyConfig(dataStr) {
      const data = decodeURIComponent(dataStr);
      localStorage.setItem('ob_settings', data);
      toast('Config applied successfully! Navigate to Settings to view.', 'success');
    }

    async function deleteConfig(id) {
      if(!confirm('Are you sure you want to delete this config?')) return;
      const res = await apiFetch('/api/configs/' + id, { method: 'DELETE' });
      if (res.ok) {
        toast('Config deleted.', 'success');
        loadConfigs();
      } else {
        toast('Failed to delete config.', 'error');
      }
    }

    // Modal logic
    function openSaveModal() { document.getElementById('saveModal').classList.add('active'); }
    function closeSaveModal() { 
      document.getElementById('saveModal').classList.remove('active'); 
      document.getElementById('confName').value = '';
    }

    async function saveConfig() {
      const name = document.getElementById('confName').value.trim();
      const is_public = document.getElementById('confPublic').checked;
      const data = localStorage.getItem('ob_settings');

      if (!name) return toast('Please enter a config name.', 'error');
      if (!data) return toast('No settings found. Go to Settings and configure first.', 'error');

      const res = await apiFetch('/api/configs', {
        method: 'POST',
        body: JSON.stringify({ name, data, is_public })
      });

      if (res.ok) {
        toast('Config saved!', 'success');
        closeSaveModal();
        loadConfigs();
      } else {
        toast('Error saving config.', 'error');
      }
      closeSaveModal();
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebarOverlay');
      sb.classList.toggle('open');
      ov.classList.toggle('open');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
    }

    initConfigs();
  </script>
</body>
</html>
