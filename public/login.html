<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OBLIVION — Login</title>
  <meta name="description" content="Login to Oblivion — The most advanced cheat platform."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --v: #7C3AED;
      --c: #06B6D4;
      --grad: linear-gradient(135deg, #7C3AED, #06B6D4);
      --bg0: #060610;
      --text: #f0f0ff;
      --text2: #9090b0;
      --text3: #5a5a7a;
      --glass-border: rgba(255,255,255,0.08);
      --radius: 12px;
      --radius-xl: 20px;
      --transition: all 0.2s ease;
      --danger: #EF4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg0);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ========= BACK LINK ========= */
    .back-link {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text2);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }
    .back-link svg { width: 18px; height: 18px; }

    /* ========= BG ========= */
    #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 600px; height: 600px; background: rgba(124,58,237,0.12); top: -200px; right: -200px; }
    .orb-2 { width: 500px; height: 500px; background: rgba(6,182,212,0.08); bottom: -200px; left: -200px; }

    /* ========= 3D CARD SCENE ========= */
    .scene {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
      perspective: 1000px;
    }

    .card-3d {
      background: rgba(10, 10, 24, 0.88);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.5rem;
      backdrop-filter: blur(24px);
      box-shadow:
        0 0 80px rgba(124,58,237,0.12),
        0 40px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.06);
      /* 3D transform will be set by JS */
      transform: rotateY(0deg) rotateX(0deg);
      transform-style: preserve-3d;
      transition: transform 0.08s ease-out, box-shadow 0.2s;
      will-change: transform;
      position: relative;
      overflow: hidden;
    }

    /* Shimmer highlight that moves with tilt */
    .card-3d::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(124,58,237,0.18) 0%, transparent 60%);
      pointer-events: none;
      transition: background 0.05s;
    }

    /* Edge glow lines */
    .card-3d::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(124,58,237,0.15), transparent 50%, rgba(6,182,212,0.08));
      pointer-events: none;
    }

    /* ========= CARD CONTENT ========= */
    .card-inner { position: relative; z-index: 1; }
    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.25rem;
    }
    .login-logo-wrap {
      width: 72px; height: 72px;
      position: relative;
    }
    .login-logo-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(124,58,237,0.6));
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% { filter: drop-shadow(0 0 18px rgba(124,58,237,0.6)); }
      50%      { filter: drop-shadow(0 0 32px rgba(6,182,212,0.7)); }
    }
    .login-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-tagline {
      color: var(--text2);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    /* ========= FORM ========= */
    .login-form { display: flex; flex-direction: column; gap: 1.25rem; }

    .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .input-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .input-wrapper { position: relative; }
    .input {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .input:focus {
      border-color: rgba(124,58,237,0.5);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }
    .input::placeholder { color: var(--text3); }
    .input-icon-right {
      position: absolute;
      right: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text2);
      cursor: pointer;
      transition: color 0.2s;
    }
    .input-icon-right:hover { color: var(--text); }

    .login-err {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      color: var(--danger);
      display: none;
    }
    .login-err.visible { display: block; }

    .login-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      border-radius: var(--radius);
      background: var(--grad);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 25px rgba(124,58,237,0.4);
      margin-top: 0.25rem;
      font-family: 'Inter', sans-serif;
    }
    .login-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 40px rgba(124,58,237,0.65); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 0.5rem 0;
    }
    .divider-line { flex: 1; height: 1px; background: var(--glass-border); }
    .divider-text { font-size: 0.72rem; color: var(--text3); letter-spacing: 0.08em; }

    .back-to-home {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text2);
    }
    .back-to-home a { color: #9f7aea; text-decoration: none; font-weight: 600; }
    .back-to-home a:hover { text-decoration: underline; }

    /* ========= RESPONSIVE ========= */
    @media (max-width: 480px) {
      .scene { padding: 1rem; }
      .card-3d { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <a href="/" class="back-link">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
    </svg>
    Back to home
  </a>

  <div class="scene" id="scene">
    <div class="card-3d" id="card3d">
      <div class="card-inner">
        <div class="login-header">
          <div class="login-logo-wrap">
            <img src="/images/logo.png" alt="Oblivion Logo"/>
          </div>
          <h1 class="login-title">OBLIVION</h1>
          <p class="login-tagline">Welcome back, commander.</p>
        </div>

        <form class="login-form" id="loginForm">
          <div id="loginErr" class="login-err">Invalid credentials. Access denied.</div>

          <div class="input-group">
            <label class="input-label" for="username">Username</label>
            <input id="username" class="input" type="text" placeholder="Enter your username" autocomplete="off" required/>
          </div>

          <div class="input-group">
            <label class="input-label" for="password">Password</label>
            <div class="input-wrapper">
              <input id="password" class="input" type="password" placeholder="Enter your password" style="padding-right:3rem;" required/>
              <span class="input-icon-right" id="togglePwd">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </span>
            </div>
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            <span id="loginBtnText">Access Oblivion</span>
          </button>
        </form>

        <div class="divider" style="margin-top:1.5rem;">
          <div class="divider-line"></div>
          <span class="divider-text">OR</span>
          <div class="divider-line"></div>
        </div>

        <div class="back-to-home">
          Don't have a key? <a href="#pricing">Get access</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== PARTICLE CANVAS =====
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.8 + 0.3,
        dx: (Math.random() - 0.5) * 0.35,
        dy: (Math.random() - 0.5) * 0.35,
        alpha: Math.random() * 0.5 + 0.1,
        da: (Math.random() - 0.5) * 0.005,
        color: Math.random() > 0.5 ? '#7C3AED' : '#06B6D4'
      });
    }
    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.alpha = Math.max(0.05, Math.min(0.7, p.alpha + p.da));
        if (p.alpha <= 0.05 || p.alpha >= 0.7) p.da *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        p.x += p.dx; p.y += p.dy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // ===== 3D CARD TILT =====
    const scene = document.getElementById('scene');
    const card  = document.getElementById('card3d');
    const MAX_ROT = 15; // degrees max tilt

    scene.addEventListener('mousemove', (e) => {
      const rect = scene.getBoundingClientRect();
      // Normalised -1 to +1
      const nx = ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      const ny = ((e.clientY - rect.top)  / rect.height) * 2 - 1;

      const rotY =  nx * MAX_ROT;
      const rotX = -ny * MAX_ROT;

      card.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg)`;
      card.style.boxShadow = `
        ${-nx * 20}px ${ny * 20}px 80px rgba(124,58,237,0.18),
        0 40px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.06)
      `;

      // Shimmer follows mouse
      const mx = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
      const my = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
      card.style.setProperty('--mx', `${mx}%`);
      card.style.setProperty('--my', `${my}%`);
    });

    scene.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateY(0deg) rotateX(0deg)';
      card.style.boxShadow = '0 0 80px rgba(124,58,237,0.12), 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06)';
      card.style.setProperty('--mx', '50%');
      card.style.setProperty('--my', '30%');
    });

    // Touch support for mobile tilt
    scene.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = scene.getBoundingClientRect();
      const nx = ((touch.clientX - rect.left) / rect.width)  * 2 - 1;
      const ny = ((touch.clientY - rect.top)  / rect.height) * 2 - 1;
      card.style.transform = `rotateY(${nx * 8}deg) rotateX(${-ny * 8}deg)`;
    }, { passive: false });

    scene.addEventListener('touchend', () => {
      card.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });

    // ===== PASSWORD TOGGLE =====
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    // ===== LOGIN FORM =====
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginErr');
      const txtEl = document.getElementById('loginBtnText');
      btn.disabled = true;
      txtEl.textContent = 'Authenticating...';
      errEl.classList.remove('visible');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('ob_token', data.token);
        localStorage.setItem('ob_role', data.role);

        txtEl.textContent = 'Access Granted ✓';
        btn.style.background = 'linear-gradient(135deg, #059669, #10B981)';

        setTimeout(() => { window.location.href = '/dashboard'; }, 700);
      } catch (err) {
        errEl.classList.add('visible');
        btn.disabled = false;
        txtEl.textContent = 'Access Oblivion';
        // Shake card
        card.style.transition = 'transform 0.05s';
        card.style.transform = 'rotateY(0) rotateX(0) translateX(-8px)';
        setTimeout(() => { card.style.transform = 'rotateY(0) rotateX(0) translateX(8px)'; }, 80);
        setTimeout(() => { card.style.transform = 'rotateY(0) rotateX(0) translateX(-5px)'; }, 160);
        setTimeout(() => { card.style.transform = 'rotateY(0) rotateX(0)'; card.style.transition = 'transform 0.08s ease-out'; }, 240);
      }
    });
  </script>
</body>
</html>
