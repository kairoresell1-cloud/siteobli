<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OBLIVION — Login</title>
  <meta name="description" content="Login to Oblivion — The most advanced cheat platform."/>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .login-wrap { position: relative; z-index: 10; width: 100%; max-width: 420px; padding: 1rem; }
    .login-card {
      background: rgba(13,13,25,0.85);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(124,58,237,0.15), 0 32px 64px rgba(0,0,0,0.5);
      animation: pageEnter 0.4s ease;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .login-logo-text {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-tagline {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-3);
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .login-form { display: flex; flex-direction: column; gap: 1.25rem; }
    .login-btn {
      width: 100%;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: var(--radius);
      background: var(--gradient);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 0 20px rgba(124,58,237,0.4);
      margin-top: 0.25rem;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(124,58,237,0.6); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .login-err {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: var(--danger);
      display: none;
    }
    .login-err.visible { display: block; }
    .logo-glow {
      width: 60px; height: 60px;
      background: var(--gradient);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 0 30px rgba(124,58,237,0.5);
    }
    .logo-glow svg { width: 28px; height: 28px; color: #fff; }
    /* Canvas particles */
    #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="animated-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:2rem;gap:1rem;">
        <img src="/images/logo.png" alt="Oblivion Logo" style="width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 15px rgba(124,58,237,0.5));"/>
        <h1 style="font-size:2rem;font-weight:900;letter-spacing:0.2em;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">OBLIVION</h1>
        <p style="color:var(--text-2);font-size:0.9rem;letter-spacing:0.05em;">Welcome back, commander.</p>
      </div>

      <form class="login-form" id="loginForm">
        <div id="loginErr" class="login-err">Invalid credentials. Access denied.</div>

        <div class="input-group">
          <label class="input-label" for="username">Username</label>
          <input id="username" class="input" type="text" placeholder="Enter username" autocomplete="off" required/>
        </div>

        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <div class="input-wrapper">
            <input id="password" class="input" type="password" placeholder="Enter password" required/>
            <span class="input-icon-right" id="togglePwd">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </span>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span id="loginBtnText">Access Oblivion</span>
        </button>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/auth.js"></script>
  <script>
    // Password toggle
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    // Particle canvas
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 2 + 0.5,
        dx: (Math.random() - 0.5) * 0.4,
        dy: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.5 + 0.1,
        color: Math.random() > 0.5 ? '#7C3AED' : '#06B6D4'
      });
    }
    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        p.x += p.dx; p.y += p.dy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginErr');
      const txtEl = document.getElementById('loginBtnText');
      btn.disabled = true;
      txtEl.textContent = 'Authenticating...';
      errEl.classList.remove('visible');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('ob_token', data.token);
        localStorage.setItem('ob_role', data.role);

        txtEl.textContent = 'Access Granted ✓';
        btn.style.background = 'linear-gradient(135deg, #059669, #10B981)';

        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 600);
      } catch (err) {
        errEl.classList.add('visible');
        btn.disabled = false;
        txtEl.textContent = 'Access Oblivion';
      }
    });
  </script>
</body>
</html>
