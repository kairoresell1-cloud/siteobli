<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OBLIVION — Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --v:#7C3AED;--c:#06B6D4;
      --grad:linear-gradient(135deg,#7C3AED,#06B6D4);
      --bg0:#060610;--text:#f0f0ff;--text2:#9090b0;--text3:#5a5a7a;
      --glass:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--radius:16px;
    }
    body{font-family:'Inter',sans-serif;background:var(--bg0);color:var(--text);overflow-x:hidden;min-height:100vh;}
    .orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;}
    .orb-1{width:700px;height:700px;background:rgba(124,58,237,0.13);top:-250px;right:-200px;}
    .orb-2{width:600px;height:600px;background:rgba(6,182,212,0.09);bottom:-200px;left:-200px;}

    /* NAVBAR */
    nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2.5rem;backdrop-filter:blur(20px);background:rgba(6,6,16,0.8);border-bottom:1px solid var(--border);}
    .nav-logo{display:flex;align-items:center;gap:.75rem;text-decoration:none;}
    .nav-logo img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(124,58,237,0.7));}
    .nav-logo-text{font-size:1.1rem;font-weight:900;letter-spacing:.15em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .nav-right{display:flex;align-items:center;gap:1.5rem;}
    .nav-right a{color:var(--text2);text-decoration:none;font-size:.875rem;font-weight:500;transition:color .2s;}
    .nav-right a:hover{color:var(--text);}
    .nav-btn{background:var(--grad)!important;color:#fff!important;padding:.55rem 1.4rem;border-radius:10px;font-weight:700!important;}

    /* HERO */
    .page-hero{position:relative;z-index:1;text-align:center;padding:8rem 2rem 5rem;}
    .s-label{font-size:.7rem;font-weight:700;letter-spacing:.3em;color:var(--c);text-transform:uppercase;margin-bottom:.75rem;}
    .page-title{font-size:clamp(2.5rem,7vw,5rem);font-weight:900;letter-spacing:.08em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1rem;}
    .page-sub{color:var(--text2);font-size:1rem;max-width:500px;margin:0 auto;line-height:1.7;}

    /* PRODUCTS GRID */
    .products-section{position:relative;z-index:1;padding:2rem 2rem 8rem;max-width:1200px;margin:0 auto;}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;}
    .product-card{
      background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);
      overflow:hidden;transition:border-color .3s,transform .3s;
      display:flex;flex-direction:column;
    }
    .product-card:hover{border-color:rgba(124,58,237,0.4);transform:translateY(-5px);}
    .product-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#0a0a18;}
    .product-img-placeholder{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(6,182,212,0.1));display:flex;align-items:center;justify-content:center;font-size:3rem;}
    .product-body{padding:1.5rem;flex:1;display:flex;flex-direction:column;gap:.75rem;}
    .product-title{font-size:1.1rem;font-weight:800;letter-spacing:.02em;}
    .product-desc{color:var(--text2);font-size:.875rem;line-height:1.65;flex:1;}
    .discord-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:.75rem;
      padding:.875rem 1.5rem;background:#5865F2;color:#fff;text-decoration:none;
      border-radius:10px;font-size:.875rem;font-weight:700;letter-spacing:.04em;
      border:none;cursor:pointer;width:100%;
      transition:transform .2s,box-shadow .2s;
      box-shadow:0 0 20px rgba(88,101,242,0.3);
    }
    .discord-btn:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(88,101,242,0.55);}
    .discord-icon{width:20px;height:20px;}

    .empty-state{text-align:center;padding:5rem 2rem;color:var(--text3);}
    .empty-state p{font-size:1.1rem;margin-top:1rem;}

    .loading-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;}
    .skeleton{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:pulse 1.5s ease-in-out infinite;}
    .skeleton-img{width:100%;aspect-ratio:16/9;background:rgba(255,255,255,0.05);}
    .skeleton-body{padding:1.5rem;display:flex;flex-direction:column;gap:.75rem;}
    .skeleton-line{height:16px;border-radius:4px;background:rgba(255,255,255,0.05);}
    .skeleton-line.w60{width:60%;}
    .skeleton-btn{height:44px;border-radius:10px;background:rgba(88,101,242,0.15);}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <nav>
    <a class="nav-logo" href="/">
      <img src="/images/logo.png" onerror="this.style.display='none'" alt="OBLIVION"/>
      <span class="nav-logo-text">OBLIVION</span>
    </a>
    <div class="nav-right">
      <a href="/">Home</a>
      <a href="/products" style="color:var(--text)">Products</a>
      <a href="/login" class="nav-btn">Dashboard</a>
    </div>
  </nav>

  <div class="page-hero">
    <div class="s-label">What we offer</div>
    <h1 class="page-title">Products</h1>
    <p class="page-sub">Browse our tools. Click any product to join our Discord and get access.</p>
  </div>

  <div class="products-section">
    <div id="productsContainer">
      <!-- Loading skeletons -->
      <div class="loading-grid" id="loadingGrid">
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line w60"></div><div class="skeleton-btn"></div></div></div>
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line w60"></div><div class="skeleton-btn"></div></div></div>
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line w60"></div><div class="skeleton-btn"></div></div></div>
      </div>
      <div class="products-grid" id="productsGrid" style="display:none"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div style="font-size:3rem">📦</div>
        <p>No products available yet.<br/>Check back soon!</p>
      </div>
    </div>
  </div>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const products = await res.json();
        document.getElementById('loadingGrid').style.display = 'none';

        if (!products.length) {
          document.getElementById('emptyState').style.display = 'block';
          return;
        }

        const grid = document.getElementById('productsGrid');
        grid.style.display = 'grid';
        grid.innerHTML = products.map(p => `
          <div class="product-card">
            ${p.image_url
              ? `<img class="product-img" src="${escHtml(p.image_url)}" alt="${escHtml(p.title)}" onerror="this.parentElement.querySelector('.product-img-placeholder').style.display='flex';this.style.display='none';"/><div class="product-img-placeholder" style="display:none">🎮</div>`
              : `<div class="product-img-placeholder">🎮</div>`
            }
            <div class="product-body">
              <div class="product-title">${escHtml(p.title)}</div>
              <div class="product-desc">${escHtml(p.description || '')}</div>
              <a class="discord-btn" href="${escHtml(p.discord_url || 'https://discord.gg/OBLIVION')}" target="_blank" rel="noopener">
                <svg class="discord-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028 14.09 14.09 0 001.226-1.994.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>
                Join Discord
              </a>
            </div>
          </div>
        `).join('');
      } catch(e) {
        document.getElementById('loadingGrid').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
      }
    }

    function escHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadProducts();
  </script>
</body>
</html>
